name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-26 platforms;android-34 build-tools;34.0.0'

      - name: Set ANDROID_SDK_ROOT
        run: echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Create local.properties for CI
        run: |
          mkdir -p ~/.android
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "Created local.properties:"
          cat local.properties

      - name: Create gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          # Enable AndroidX
          android.useAndroidX=true
          
          # Optimize build performance
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.workers.max=2
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2048m
          
          # Kotlin compiler settings
          kotlin.incremental=true
          EOF
          echo "Created gradle.properties:"
          cat gradle.properties

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore